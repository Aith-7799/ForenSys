services:
  db:
    image: postgres:16-alpine
    container_name: forensys-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forensys
      POSTGRES_PASSWORD: forensys
      POSTGRES_DB: forensys
    ports:
      - "5432:5432"
    volumes:
      - forensys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensys -d forensys"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forensys-pgdata:
